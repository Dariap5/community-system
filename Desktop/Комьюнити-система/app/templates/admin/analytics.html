{% extends "admin/base.html" %} {% block title %}Аналитика{% endblock %} {% block content %}
<div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
    <div>
        <h2 class="text-3xl font-semibold">Аналитика</h2>
        <p class="text-sm text-slate-500 mt-1">Общие метрики и распределение пользователей по шагам</p>
    </div>
    <label class="flex items-center gap-2 text-sm text-slate-600">
        <span>Период</span>
        <select id="period" class="rounded-lg border border-slate-300 px-3 py-2">
            <option value="7">7 дней</option>
            <option value="30" selected>30 дней</option>
            <option value="365">365 дней</option>
        </select>
    </label>
</div>

<section id="summary" class="mb-8 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-5"></section>

<section>
    <h3 class="mb-4 text-xl font-semibold">Воронки</h3>
    <div id="funnels-stats" class="space-y-4"></div>
</section>
{% endblock %} {% block scripts %}
<script src="/static/admin/analytics.js"></script>
{% endblock %}
