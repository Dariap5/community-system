name: community-bot

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  init-db:
    build: .
    command: sh -c "alembic upgrade head && python -m app.db.seed"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    command: python -m app.bot.main
    env_file: .env
    depends_on:
      init-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=INFO
    env_file: .env
    depends_on:
      init-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: .
    command: celery -A app.tasks.celery_app beat --loglevel=INFO
    env_file: .env
    depends_on:
      init-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped

  tests:
    build: .
    profiles: ["tests"]
    command: sh -c "pip install -e \".[dev]\" && pytest tests/ -v"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    volumes:
      - ./tests:/app/tests:ro
    restart: "no"

volumes:
  db_data: